<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>عطل فني</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.22);
            --text: rgba(255, 255, 255, 0.92);
            --muted: rgba(255, 255, 255, 0.75);
            --shadow: 0 18px 60px rgba(0, 0, 0, .35);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Cairo", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            color: var(--text);
            display: grid;
            place-items: center;
            padding: 24px;
            overflow: hidden;

            background:
                radial-gradient(1200px 700px at 10% 10%, rgba(0, 180, 255, 0.35), transparent 60%),
                radial-gradient(900px 600px at 90% 30%, rgba(180, 90, 255, 0.28), transparent 55%),
                radial-gradient(800px 650px at 40% 95%, rgba(0, 255, 170, 0.18), transparent 60%),
                linear-gradient(135deg, #0b1020, #0a0f1b 55%, #070b14);
        }

        .blob {
            position: absolute;
            filter: blur(35px);
            opacity: .55;
            border-radius: 999px;
            z-index: 0;
        }

        .b1 {
            width: 380px;
            height: 380px;
            left: -120px;
            top: -120px;
            background: rgba(0, 180, 255, .55);
        }

        .b2 {
            width: 420px;
            height: 420px;
            right: -160px;
            top: 80px;
            background: rgba(180, 90, 255, .5);
        }

        .b3 {
            width: 360px;
            height: 360px;
            left: 30%;
            bottom: -170px;
            background: rgba(0, 255, 170, .35);
        }

        .card {
            position: relative;
            z-index: 1;
            width: min(720px, 100%);
            padding: 34px 28px;
            border-radius: 22px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .top {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .icon {
            width: 54px;
            height: 54px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            background: rgba(255, 255, 255, .10);
            border: 1px solid rgba(255, 255, 255, .18);
        }

        h1 {
            margin: 0;
            font-size: clamp(22px, 3vw, 30px);
            letter-spacing: .2px;
        }

        p {
            margin: 14px 0 0;
            color: var(--muted);
            line-height: 1.9;
            font-size: clamp(15px, 2vw, 17px);
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, .16);
            margin: 18px 0;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 8px 12px;
            border-radius: 999px;
            font-size: 14px;
            background: rgba(255, 255, 255, .10);
            border: 1px solid rgba(255, 255, 255, .18);
        }

        .hint {
            font-size: 14px;
            color: rgba(255, 255, 255, .72);
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border-radius: 14px;
            text-decoration: none;
            color: rgba(255, 255, 255, .92);
            background: rgba(255, 255, 255, .10);
            border: 1px solid rgba(255, 255, 255, .18);
            box-shadow: 0 10px 26px rgba(0, 0, 0, .22);
            transition: transform .15s ease, background .15s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:hover {
            transform: translateY(-1px);
            background: rgba(255, 255, 255, .14);
        }

        .btn:active {
            transform: translateY(0px);
        }

        @media (prefers-reduced-motion: no-preference) {
            .card {
                animation: float 6.5s ease-in-out infinite;
            }

            @keyframes float {

                0%,
                100% {
                    transform: translateY(0);
                }

                50% {
                    transform: translateY(-6px);
                }
            }
        }
    </style>
</head>

<body>
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>

    <main class="card" role="main" aria-label="صفحة العطل الفني">
        <div class="top">
            <div class="icon" aria-hidden="true">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
                    <path d="M12 9v5" stroke="white" stroke-width="2" stroke-linecap="round" />
                    <path d="M12 17h.01" stroke="white" stroke-width="3" stroke-linecap="round" />
                    <path d="M10.3 4.3 2.7 18a2 2 0 0 0 1.7 3h15.2a2 2 0 0 0 1.7-3L13.7 4.3a2 2 0 0 0-3.4 0Z"
                        stroke="white" stroke-width="1.6" opacity=".95" />
                </svg>
            </div>

            <div>
                <h1>نأسف، يوجد عطل فني</h1>
                <p>نعمل الآن على إصلاحه بأسرع وقت ممكن. شكرًا لتفهمك.</p>
            </div>
        </div>

        <div class="divider"></div>

        <div class="row">
            <span class="badge">حالة الخدمة: تحت الصيانة</span>
            <span class="hint">جرّب تحديث الصفحة بعد قليل</span>
        </div>

        <div class="actions" aria-label="طرق التواصل">
            <!-- واتساب: غيّر الرسالة لو تحب -->
            <a class="btn"
                href="https://wa.me/201111152954?text=%D9%85%D8%B1%D8%AD%D8%A8%D8%A7%D8%8C%20%D8%B9%D9%86%D8%AF%D9%8A%20%D9%85%D8%B4%D9%83%D9%84%D8%A9%20%D9%81%D9%8A%20%D8%A7%D9%84%D8%AE%D8%AF%D9%85%D8%A9"
                target="_blank" rel="noopener">
                <!-- أيقونة واتساب -->
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path
                        d="M20.5 11.9c0 4.6-3.8 8.4-8.5 8.4-1.4 0-2.7-.3-3.9-1l-4.6 1.4 1.5-4.4c-.8-1.3-1.2-2.8-1.2-4.4C3.8 7.3 7.6 3.5 12 3.5s8.5 3.8 8.5 8.4Z"
                        stroke="white" stroke-width="1.6" opacity=".9" />
                    <path
                        d="M9.2 8.6c-.2 0-.5 0-.7.2-.2.2-.6.6-.6 1.4s.6 1.7.7 1.9c.1.2 1.2 2 2.9 2.7 1.4.6 1.7.5 2 .5.3 0 1-.4 1.2-.8.2-.4.2-.8.1-.9-.1-.1-.2-.2-.5-.3l-1.1-.5c-.2-.1-.4 0-.6.2l-.4.5c-.1.2-.3.2-.5.1-.2-.1-.9-.3-1.7-1.1-.6-.6-1.1-1.4-1.2-1.6-.1-.2 0-.4.1-.5l.3-.3c.1-.1.2-.3.3-.4.1-.2.1-.3 0-.5l-.5-1.1c-.1-.3-.3-.4-.5-.4Z"
                        fill="white" opacity=".9" />
                </svg>
                تواصل معنا واتساب
            </a>

            <!-- اتصال مباشر -->
            <a class="btn" href="tel:01111152954">
                <!-- أيقونة هاتف -->
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path
                        d="M7.2 3.8 9.3 3c.6-.2 1.2.1 1.4.7l1 2.6c.2.5 0 1.1-.4 1.4l-1.4 1c-.2.1-.3.4-.2.6.6 1.4 1.6 2.8 2.9 4 .4.4.9.7 1.4 1 .2.1.5 0 .6-.2l1-1.4c.3-.4.9-.6 1.4-.4l2.6 1c.6.2.9.8.7 1.4l-.8 2.1c-.2.6-.8 1-1.4.9-2.2-.3-4.6-1.5-6.8-3.6-2.1-2.1-3.3-4.6-3.6-6.8-.1-.6.3-1.2.9-1.4Z"
                        stroke="white" stroke-width="1.6" stroke-linejoin="round" opacity=".95" />
                </svg>
                اتصال: 01111152954
            </a>
        </div>
    </main>
</body>

</html>
