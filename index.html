<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ace Cafe</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.22);
            --text: rgba(255, 255, 255, 0.94);
            --muted: rgba(255, 255, 255, 0.78);
            --shadow: 0 18px 60px rgba(0, 0, 0, .35);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Cairo", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            color: var(--text);
            display: grid;
            place-items: center;
            padding: 18px;
            overflow: hidden;

            background:
                radial-gradient(900px 600px at 15% 10%, rgba(0, 180, 255, 0.32), transparent 60%),
                radial-gradient(700px 520px at 85% 25%, rgba(180, 90, 255, 0.26), transparent 55%),
                radial-gradient(650px 520px at 50% 95%, rgba(0, 255, 170, 0.16), transparent 60%),
                linear-gradient(135deg, #0b1020, #0a0f1b 55%, #070b14);
        }

        /* خلفية فقاعات ناعمة */
        .blob {
            position: absolute;
            filter: blur(35px);
            opacity: .55;
            border-radius: 999px;
            z-index: 0;
        }

        .b1 {
            width: 300px;
            height: 300px;
            left: -110px;
            top: -120px;
            background: rgba(0, 180, 255, .55);
        }

        .b2 {
            width: 330px;
            height: 330px;
            right: -140px;
            top: 60px;
            background: rgba(180, 90, 255, .5);
        }

        .b3 {
            width: 280px;
            height: 280px;
            left: 22%;
            bottom: -140px;
            background: rgba(0, 255, 170, .35);
        }

        /* كارت موبايل */
        .card {
            position: relative;
            z-index: 1;
            width: min(420px, 100%);
            padding: 28px 18px;
            border-radius: 22px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            text-align: center;
        }

        .spade {
            font-size: 96px;
            line-height: 1;
            margin: 6px 0 10px;
            text-shadow: 0 16px 50px rgba(0, 0, 0, .35);
            user-select: none;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: .2px;
        }

        p {
            margin: 8px 0 0;
            color: var(--muted);
            line-height: 1.9;
            font-size: 15px;
        }

        .btn {
            margin-top: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 16px;
            border-radius: 16px;
            text-decoration: none;
            color: rgba(255, 255, 255, .95);
            background: rgba(255, 255, 255, .12);
            border: 1px solid rgba(255, 255, 255, .22);
            box-shadow: 0 10px 26px rgba(0, 0, 0, .22);
            transition: transform .15s ease, background .15s ease;
            -webkit-tap-highlight-color: transparent;
            font-weight: 700;
        }

        .btn:hover {
            transform: translateY(-1px);
            background: rgba(255, 255, 255, .16);
        }

        .btn:active {
            transform: translateY(0px);
        }

        .btn svg {
            opacity: .95;
        }

        @media (prefers-reduced-motion: no-preference) {
            .card {
                animation: float 6.5s ease-in-out infinite;
            }

            @keyframes float {

                0%,
                100% {
                    transform: translateY(0);
                }

                50% {
                    transform: translateY(-6px);
                }
            }
        }
    </style>
</head>

<body>
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>

    <main class="card" role="main" aria-label="Ace Cafe">
        <div class="spade" aria-hidden="true">♠</div>

        <h1>أهلاً بك في Ace Cafe</h1>
        <p>اضغط الزر بالأسفل للذهاب إلى المنيو.</p>

        <a class="btn" href="https://qr-menu-ace.web.app/menu/ace">
            <!-- أيقونة بسيطة -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 7a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V7Z" stroke="white"
                    stroke-width="1.6" opacity=".95" />
                <path d="M8 9h8M8 12h8M8 15h5" stroke="white" stroke-width="1.6" stroke-linecap="round" opacity=".95" />
            </svg>
            اذهب للمنيو
        </a>
    </main>
</body>

</html>
